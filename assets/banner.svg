<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16;border-radius:14px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>

    <filter id="badge-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <style>
      @keyframes scanline {
        0% { transform: translateY(-30px); opacity: 0; }
        15% { opacity: 0.8; }
        85% { opacity: 0.8; }
        100% { transform: translateY(380px); opacity: 0; }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(25px, -18px) scale(1.08); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-30px, 20px) scale(1.12); }
      }
      @keyframes pulseGrid {
        0%, 100% { opacity: 0.12; }
        50% { opacity: 0.25; }
      }
      @keyframes cardSlide1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes cardSlide2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      .scanner-beam {
        animation: scanline 6.5s ease-in-out infinite;
      }
      .orb-1 {
        animation: floatSlow1 10s ease-in-out infinite;
      }
      .orb-2 {
        animation: floatSlow2 12s ease-in-out infinite;
      }
      .grid-layer {
        animation: pulseGrid 7s ease-in-out infinite;
      }
      .float-card-1 {
        animation: cardSlide1 5s ease-in-out infinite;
      }
      .float-card-2 {
        animation: cardSlide2 6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Deep Background -->
  <rect width="100%" height="100%" fill="url(#bg-glow)" />

  <!-- Dynamic Ambient Orbs (Background layer) -->
  <g>
    <circle class="orb-1" cx="220" cy="90" r="140" fill="#38bdf8" opacity="0.16" filter="url(#glow-blur)" />
    <circle class="orb-2" cx="980" cy="270" r="160" fill="#a855f7" opacity="0.18" filter="url(#glow-blur)" />
    <circle class="orb-1" cx="800" cy="80" r="120" fill="#3b82f6" opacity="0.13" filter="url(#glow-blur)" />
  </g>

  <!-- Subtle Cyber Code Matrix Grid (Background) -->
  <g class="grid-layer" stroke="#38bdf8" stroke-width="0.8" opacity="0.15">
    <line x1="0" y1="60" x2="1200" y2="60" stroke-dasharray="4,6" />
    <line x1="0" y1="120" x2="1200" y2="120" stroke-dasharray="4,6" />
    <line x1="0" y1="180" x2="1200" y2="180" stroke-dasharray="4,6" />
    <line x1="0" y1="240" x2="1200" y2="240" stroke-dasharray="4,6" />
    <line x1="0" y1="300" x2="1200" y2="300" stroke-dasharray="4,6" />
    <line x1="150" y1="0" x2="150" y2="360" stroke-dasharray="4,6" />
    <line x1="300" y1="0" x2="300" y2="360" stroke-dasharray="4,6" />
    <line x1="450" y1="0" x2="450" y2="360" stroke-dasharray="4,6" />
    <line x1="600" y1="0" x2="600" y2="360" stroke-dasharray="4,6" />
    <line x1="750" y1="0" x2="750" y2="360" stroke-dasharray="4,6" />
    <line x1="900" y1="0" x2="900" y2="360" stroke-dasharray="4,6" />
    <line x1="1050" y1="0" x2="1050" y2="360" stroke-dasharray="4,6" />
  </g>

  <!-- Dynamic Scanning Beam (Background Layer, won't obscure foreground) -->
  <g class="scanner-beam">
    <rect x="0" y="0" width="1200" height="2" fill="url(#cyan-glow)" />
    <rect x="0" y="2" width="1200" height="28" fill="url(#cyan-glow)" opacity="0.25" />
  </g>

  <!-- Left Dynamic Status Pill (Decorative Background/Midground) -->
  <g class="float-card-1" transform="translate(60, 48)" filter="url(#badge-shadow)">
    <rect width="185" height="42" rx="21" fill="url(#pill-grad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="22" cy="21" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="26" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="0.5">AST VULN AUDIT: 0 BUGS</text>
  </g>

  <!-- Right Dynamic Status Pill (Decorative Background/Midground) -->
  <g class="float-card-2" transform="translate(950, 48)" filter="url(#badge-shadow)">
    <rect width="190" height="42" rx="21" fill="url(#pill-grad)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="24" cy="21" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text x="38" y="26" fill="#cbd5e1" font-size="12" font-weight="600" letter-spacing="0.5">QUALITY GATE: PASSED</text>
  </g>

  <!-- FOREGROUND: High-Contrast Permanent Clear Titles -->
  <!-- Top Super-Header Tag -->
  <g transform="translate(600, 95)" text-anchor="middle">
    <rect x="-160" y="-18" width="320" height="30" rx="15" fill="#1e293b" fill-opacity="0.95" stroke="#475569" stroke-width="1" />
    <text y="2" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.5">⚡ ENTERPRISE &amp; OPEN-SOURCE VERIFICATION</text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(600, 160)" text-anchor="middle">
    <text fill="url(#primary-grad)" font-size="37" font-weight="900" letter-spacing="-0.5" filter="url(#badge-shadow)">
      Awesome Static Analysis &amp; Code Quality
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 202)" text-anchor="middle">
    <text fill="#94a3b8" font-size="16" font-weight="400" letter-spacing="0.2">
      Curated Index of SAST Engines • Linters • Type Checkers • Secret Scanners • CI/CD Quality Gates
    </text>
  </g>

  <!-- Feature Tags / Capabilities Badges (Foreground Bottom) -->
  <g transform="translate(190, 260)">
    <!-- Tag 1 -->
    <g transform="translate(0, 0)">
      <rect width="145" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="72" y="22" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">🛡️ SAST &amp; Secrets</text>
    </g>
    <!-- Tag 2 -->
    <g transform="translate(160, 0)">
      <rect width="145" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="72" y="22" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">⚡ Rust-Speed Linters</text>
    </g>
    <!-- Tag 3 -->
    <g transform="translate(320, 0)">
      <rect width="165" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="82" y="22" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">🔍 Formal Verification</text>
    </g>
    <!-- Tag 4 -->
    <g transform="translate(500, 0)">
      <rect width="155" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="77" y="22" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">📊 CI Quality Gates</text>
    </g>
    <!-- Tag 5 -->
    <g transform="translate(670, 0)">
      <rect width="150" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="75" y="22" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">☁️ SaaS &amp; Self-Hosted</text>
    </g>
  </g>

  <!-- Modern Corner Accent Lines -->
  <path d="M 20 50 L 20 20 L 50 20" stroke="#38bdf8" stroke-width="2.5" fill="none" opacity="0.8" />
  <path d="M 1180 50 L 1180 20 L 1150 20" stroke="#a855f7" stroke-width="2.5" fill="none" opacity="0.8" />
  <path d="M 20 310 L 20 340 L 50 340" stroke="#38bdf8" stroke-width="2.5" fill="none" opacity="0.8" />
  <path d="M 1180 310 L 1180 340 L 1150 340" stroke="#a855f7" stroke-width="2.5" fill="none" opacity="0.8" />
</svg>